schema_version = 1
name = "gate_zero_source_base_training_topology_v1"
status = "predeclared_before_multigpu_probe_outcomes"
predeclared_at_utc = "2026-07-18T09:18:00Z"
last_mechanical_amendment_at_utc = "2026-07-18T11:42:00Z"
amendment_scope = "engineering_throughput_only_no_scientific_budget_change"
mechanical_amendments = [
  "compare actual global flow-input hashes rather than topology-dependent ambient RNG serialization",
  "hash shared model and source HDF5 authorities once per process before reuse across probe branches",
  "record exact initial model optimizer and scheduler state across topology candidates",
  "freeze the known-static DDP graph so reducer bucket lifecycle is identical after resume",
  "establish fresh training RNG after one-time runtime setup at the same boundary used for checkpoint RNG restore",
]

[authority]
gate_zero_contract_path = "configs/gate_zero_oracle_pilot.toml"
gate_zero_contract_sha256 = "7bbda2723c72c60c6cfc39c10acaf23a05f4ea0af724c054792cd00c890cfd98"
phase0_contract_path = "configs/phase0.toml"
phase0_contract_sha256 = "ba9e89971e0f88074cc8de573c8e60b9093105638364a60207ff0d5aa8b7882a"
single_gpu_reference_commit = "8ff06f269c151fbce3706c033470300a5c705a45"
single_gpu_reference_longrun = "gate_zero_source_base_fit_10k_20260718_090528"
single_gpu_reference_is_not_interrupted = true

[distributed]
allowed_world_sizes = [1, 2, 4]
backend = "nccl"
global_effective_batch_size = 64
gradient_aggregation = "ddp_mean_equal_local_batch"
ddp_static_graph = true
global_slot_algorithm = "absolute_optimizer_step_accumulation_rank_local_slot_v1"
flow_input_authority = "rank0_global_native_sample_then_contiguous_scatter_v1"
rank_zero_checkpoint_only = true
save_every_rank_rng = true
sampler_loader_state = "reconstructed_from_absolute_step_rank_world_size_and_seed"
resume_requires_same_world_size_and_topology = true
trackio_rank_zero_only = true
checkpoint_manifest_schema_version = 3
total_data_workers = 4
training_file_hash_authority = "rank0_once_per_process_then_shared_filesystem_load_reuse"
minimum_free_memory_mib = 10240
maximum_world_size = 4

[distributed.world_size_1]
per_rank_micro_batch_size = 64
gradient_accumulation_steps = 1
data_workers_per_rank = 4

[distributed.world_size_2]
per_rank_micro_batch_size = 32
gradient_accumulation_steps = 1
data_workers_per_rank = 2

[distributed.world_size_4]
per_rank_micro_batch_size = 16
gradient_accumulation_steps = 1
data_workers_per_rank = 1

[probe]
candidate_world_sizes = [1, 2, 4]
warmup_optimizer_steps = 5
measured_optimizer_steps = 25
checkpoint_after_optimizer_steps = 30
resume_validation_optimizer_steps = 1
same_global_samples_across_candidates = true
same_initial_trainable_state = true
same_optimizer_scheduler = true
same_global_flow_inputs = true
record_policy_outcomes = false
retain_full_checkpoint_until_resume_validation = true
cleanup_validated_probe_checkpoints = true

[selection]
primary_metric = "global_effective_samples_per_second"
require_zero_duplicate_or_missing_global_slots = true
require_same_topology_resume_pass = true
require_minimum_free_memory_mib = 10240
minimum_speedup_over_single_gpu = 1.20
minimum_parallel_efficiency = 0.55
rule = "choose_fastest_safe_candidate_meeting_speedup_and_parallel_efficiency_else_use_one_gpu_per_independent_job"
tie_break = "fewer_gpus_within_two_percent_of_fastest"
scientific_thresholds_may_change = false
model_or_data_budget_may_change = false

[selection.authority]
status = "pending_fixed_1_2_4_probe"
formal_distributed_fit_authorized = false
selected_world_size = 0
selection_report_sha256 = ""
gate_zero_authorized = false
writer_authorized = false

[resources]
maximum_concurrent_gpus = 4
expected_peak_additional_storage_gib = 5.0
telemetry_interval_milliseconds = 500
stop_conditions = [
  "global_slot_duplicate_or_omission",
  "nonfinite_loss_or_gradient",
  "same_topology_resume_mismatch",
  "checkpoint_partial_publish",
  "minimum_headroom_violation",
  "error",
]
